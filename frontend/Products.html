<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Shop the edit | ThinkMart</title>
  <link rel="icon" href="assets/thinkmart-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="products">
  <div class="site-shell"><div data-app-header></div>
    <main class="site-main">
      <section class="page-intro"><div class="container"><div class="breadcrumb"><a href="Home-Page.html">Home</a><i class="fa-solid fa-chevron-right"></i><span>Shop</span></div><span class="eyebrow">Find a good thing</span><h1 class="display-title">The ThinkMart edit</h1><p>Thoughtful tech and everyday essentials, selected for the things you do most.</p></div></section>
      <div class="container catalog-layout">
        <aside class="filter-panel"><h3>Refine your search</h3><div class="filter-group"><h3>Categories</h3><div data-category-filters><span class="muted">Loading categories...</span></div></div><div class="filter-group"><label for="sort-products" style="font-weight:700;color:var(--ink)">Sort by</label><select class="filter-select" id="sort-products" data-sort-products><option value="">Featured</option><option value="newest">Newest</option><option value="rating">Top rated</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select></div></aside>
        <section aria-label="Products"><div class="catalog-top"><span class="catalog-count" data-product-count>Loading products...</span><div class="header-search catalog-search" style="display:block"><label class="sr-only" for="catalog-search">Search products</label><input id="catalog-search" type="search" data-catalog-search placeholder="Search the edit..."><i class="fa-solid fa-magnifying-glass" style="position:absolute;right:14px;top:14px;color:#64748b"></i></div></div><div class="product-grid catalog-grid" data-products-grid><div class="product-loading"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading the edit...</div></div></section>
      </div>
    </main>
    <div data-app-footer></div>
  </div>
  <script src="js/app.js" defer></script>
</body>
</html>
